<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创建投票</title>
  <style>
    *,*::before,*::after { box-sizing: border-box }
    html,body { margin:0; padding:0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#222; background:#fafafa }
    main { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 4rem }
    h1 { font-size: 1.4rem; margin: .25rem 0 1rem }
    form { display: grid; gap: 1rem }
    label { display: grid; gap: .35rem; font-weight: 600 }
    input[type="text"], input[type="datetime-local"], textarea {
      font: inherit; padding: .55rem .65rem; border: 1px solid #ccc; border-radius: 8px;
      min-height: 44px; width: 100%;
    }
    textarea { min-height: 96px; resize: vertical }
    button {
      font: inherit; font-weight: 600; padding: .7rem 1rem; border: 0; border-radius: 8px;
      background: #2563eb; color: #fff; min-height: 44px; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px }
    .options-list { display: grid; gap: .5rem; list-style: none; padding: 0; margin: 0 }
    .option { padding: .65rem .8rem; border: 1px solid #e5e7eb; background:#fff; border-radius: 8px }
    .meta { color:#666; font-size:.9rem }
    .err { color:#b91c1c }
  </style>
</head>
<body>
  <main>
    
    <h1>创建投票</h1>
    <p class="meta">投票"中午吃啥 / 周末去哪玩"这类小决策。</p>
    <form id="create-form" method="post" action="/api/polls">
      <label>问题
        <input type="text" name="question" required minlength="1" maxlength="200" placeholder="例：中午吃啥？">
      </label>
      <label>候选项（2-10 个，每行一个）
        <textarea name="options" required placeholder="拉面&#10;盖饭&#10;..."></textarea>
      </label>
      <label>截止时间（最短 10 分钟、最长 30 天）
        <input type="datetime-local" name="deadline" required min="2026-05-13T04:46">
      </label>
      <label style="flex-direction: row; display: flex; gap: .5rem; align-items: center; font-weight:400">
        <input type="checkbox" name="publicDetails">
        公开明细（结果中显示每人投了什么）
      </label>
      <button type="submit">创建投票</button>
      <p id="form-error" class="err" role="alert" aria-live="polite"></p>
    </form>
    <script>
      const form = document.getElementById('create-form');
      const err = document.getElementById('form-error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        const fd = new FormData(form);
        const options = String(fd.get('options') || '')
          .split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const payload = {
          question: String(fd.get('question') || ''),
          options,
          deadline: new Date(String(fd.get('deadline'))).toISOString(),
          publicDetails: fd.get('publicDetails') === 'on',
        };
        const r = await fetch('/api/polls', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          err.textContent = '创建失败：' + (j.error || r.statusText);
          return;
        }
        const data = await r.json();
        location.href = data.adminUrl;
      });
    </script>
    
  </main>
</body>
</html>
